<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>SWIFTMYND</title>
  <script>
    var path = window.location.pathname.toLowerCase();
    var search = window.location.search;
    var hash = window.location.hash;
    if (path.indexOf('login') !== -1 || hash.indexOf('login') !== -1 || search.indexOf('login') !== -1) {
      window.location.replace('/?login=true');
    } else {
      window.location.replace('/' + hash);
    }
  </script>
</head>
<body style="margin:0;background:#0f172a;display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;font-family:sans-serif;">
  <p style="font-size:14px;color:#94a3b8;">جاري التحميل...</p>
</body>
</html>
